name: Memory soak

# The memory soak (#99) as a regression gate (#103): 10 minutes of chunk cycles on the preview
# build in headless Chromium, judged by scripts/soak/soakGate.mjs as the perf pass proved it (report
# section 6): 4 warm-up cycles skipped, then FAIL on more than 20 MB median-heap growth, geometries,
# textures or colliders rising in 3 of the last 10 steps without falling, any page error, or fewer
# than 15 cycles. One cycle takes ~36 s, so no shorter profile can pass: it runs nightly, by hand
# and on pull requests labelled `perf`, never on every push.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A new push to a labelled pull request supersedes the soak still running on the old one.
concurrency:
  group: memory-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    # Pull requests only with the `perf` label; labelling one runs it once, for that label only.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds, then soaks `?debug` (the soak reads the game only through steampunkDebug). SwiftShader
      # draws at a few frames a second, but the sim keeps real time, so the cycles still stream chunks.
      - run: npm run soak:memory
      - if: ${{ !cancelled() }}
        run: node scripts/soak/soakMemory.mjs --job-summary test-results/soak >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak
          path: |
            test-results/soak/soak.json
            test-results/soak/summary.json
            test-results/soak/soak-chart.svg
          if-no-files-found: warn
      # The start, mid and end heap snapshots (tens of MB each) only when there is a leak to find.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak-heap-snapshots
          path: test-results/soak/*.heapsnapshot
          retention-days: 7
          if-no-files-found: ignore
