name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every push and pull request: lint, types, the Vitest tests the change can reach and the build.
  # scripts/ci/selectPushTests.sh picks the tests:
  # scoped to the import graph of the changed files (plus fs-read rules), or the whole suite when a
  # change cannot be mapped. The pacing bot regressions (NIGHTLY_ONLY_TESTS in vite.config.ts)
  # never run here; nightly.yml runs the true full suite, `npm test`, and balance:report nightly.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI never launches Electron here, so skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, so the push's `before` commit and the pull request's merge base resolve.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Pick the Vitest run (scoped or full)
        id: pick
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          RELATED_LIST: ${{ runner.temp }}/vitest-related.txt
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "origin/$PR_BASE_REF" HEAD || true)
          else
            BASE="$PUSH_BEFORE"
          fi
          scripts/ci/selectPushTests.sh "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vitest (${{ steps.pick.outputs.mode }})
        env:
          SKIP_NIGHTLY_ONLY_TESTS: '1'
          MODE: ${{ steps.pick.outputs.mode }}
          REASON: ${{ steps.pick.outputs.reason }}
          RELATED_LIST: ${{ runner.temp }}/vitest-related.txt
        run: |
          case "$MODE" in
            full)
              echo "Full suite minus the nightly-only pacing tests: $REASON"
              npm run test:push
              ;;
            scoped)
              echo "Scoped to the tests related to: $(paste -sd ' ' - <"$RELATED_LIST")"
              mapfile -t related <"$RELATED_LIST"
              npx vitest related --run --passWithNoTests "${related[@]}"
              ;;
            *)
              echo "Skipping Vitest: $REASON"
              ;;
          esac
      - run: npm run build
      # balance:report replays the pacing bot (over 4 minutes by itself), so it runs nightly only.

  # Every pull request: the same golden digests on Windows as on Linux (#3, #5 and #11 acceptance),
  # including the second slice's casing, collapse, bay and artefact runs (S11, #65).
  determinism:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run src/logging/goldenRun.test.ts src/logging/secondSliceGolden.test.ts
          src/systems/replay
          src/systems/money.test.ts src/systems/world/generatorGolden.test.ts
