name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every push and pull request: lint, formatting, types and the build. Tests no longer run in
  # Actions: the loop's Tester runs them on the build box after every push to main (relevant tests
  # first, then the pacing bot and e2e) and nightly (full suite, soak, packaged smoke, balance,
  # benches), records them on the test-metrics branch and posts box-tester/* commit statuses
  # (docs/metrics/test-metrics.md).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI never launches Electron here, so skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Every pull request: the same golden digests on Windows as on Linux (#3, #5 and #11 acceptance),
  # including the second slice's casing, collapse, bay and artefact runs (S11, #65).
  determinism:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run src/logging/goldenRun.test.ts src/logging/secondSliceGolden.test.ts
          src/systems/replay
          src/systems/money.test.ts src/systems/world/generatorGolden.test.ts
