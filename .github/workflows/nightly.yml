name: Nightly full suite

on:
  schedule:
    # 01:30 UTC, when the build loop is quiet.
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  # The true full suite, `npm test`, including the pacing bot regressions that the per-push verify
  # job of ci.yml leaves out (NIGHTLY_ONLY_TESTS in vite.config.ts), then the balance report.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Runs even when a test failed, so the numbers are there to read next to the failure.
      - if: success() || failure()
        run: npm run balance:report
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-nightly
          path: balance-report/
